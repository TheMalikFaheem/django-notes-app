{% extends 'notes/base.html' %}

{% block content %}
<div class="flex justify-between items-center mb-8">
    <h2 class="text-3xl font-bold text-gray-800">My Documents</h2>
    <a href="{% url 'note_create' %}" class="bg-indigo-600 text-white px-5 py-2 rounded-lg hover:bg-indigo-700 shadow-md transition-all">
        Create New
    </a>
</div>

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    {% for note in notes %}
    <a href="{% url 'note_update' note.pk %}" class="block group">
        <div class="bg-white p-6 rounded-xl shadow-sm hover:shadow-md transition-shadow border border-gray-100 h-64 flex flex-col relative">
            <h3 class="text-xl font-semibold text-gray-800 mb-2 group-hover:text-indigo-600">{{ note.title }}</h3>
            <p class="text-gray-500 text-sm mb-4 line-clamp-4 flex-1">
                {{ note.content|truncatewords:30 }}
            </p>
            <div class="text-xs text-gray-400 mt-auto pt-4 border-t border-gray-100 flex justify-between items-center">
                <span>Updated: {{ note.last_modified|date:"M d, Y" }}</span>
                <span class="text-indigo-400 opacity-0 group-hover:opacity-100 transition-opacity">Edit →</span>
            </div>
        </div>
    </a>
    {% empty %}
    <div class="col-span-full text-center py-20 text-gray-400">
        <p class="text-lg">No documents found. Start by creating one!</p>
    </div>
    {% endfor %}
</div>
{% endblock %}
