<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django Notes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex">

    <aside class="w-64 bg-white border-r border-gray-200 hidden md:block">
        <div class="p-6">
            <h1 class="text-2xl font-bold text-indigo-600 flex items-center gap-2">
                <span>📝</span> NotesApp
            </h1>
        </div>
        <nav class="mt-4 px-4">
            <a href="{% url 'note_list' %}" class="block px-4 py-3 text-gray-700 hover:bg-indigo-50 hover:text-indigo-600 rounded-lg transition-colors">
                All Documents
            </a>
            <a href="{% url 'note_create' %}" class="block px-4 py-3 mt-2 text-gray-700 hover:bg-indigo-50 hover:text-indigo-600 rounded-lg transition-colors">
                + New Document
            </a>
        </nav>
    </aside>

    <main class="flex-1 p-8 overflow-y-auto">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
